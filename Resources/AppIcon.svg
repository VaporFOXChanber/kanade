<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- アンプの音量ノブ。角丸と縁の光沢は macOS が付けるので、ここでは正方形いっぱいに描く -->
<defs>
<linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#34363E"/>
<stop offset="1" stop-color="#101115"/>
</linearGradient>
<radialGradient id="bglow" cx=".5" cy=".53" r=".5">
<stop offset=".55" stop-color="#FFA63D" stop-opacity=".28"/>
<stop offset="1" stop-color="#FFA63D" stop-opacity="0"/>
</radialGradient>
<linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4F5F7"/>
<stop offset=".5" stop-color="#9AA0AA"/>
<stop offset="1" stop-color="#4A4E57"/>
</linearGradient>
<linearGradient id="bcap" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5A5E68"/>
<stop offset="1" stop-color="#23252B"/>
</linearGradient>
<linearGradient id="bsheen" x1="0" y1="0" x2="1" y2="1">
<stop offset=".2" stop-color="#fff" stop-opacity=".22"/>
<stop offset=".5" stop-color="#fff" stop-opacity="0"/>
<stop offset=".85" stop-color="#fff" stop-opacity=".08"/>
</linearGradient>
<filter id="bds" x="-30%" y="-30%" width="160%" height="170%">
<feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity=".6"/>
</filter>
<filter id="bbl" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="9"/>
</filter>
</defs>
<rect width="1024" height="1024" fill="url(#bbg)"/>
<g transform="translate(512 512) scale(1.2) translate(-512 -530)">
<circle cx="512" cy="540" r="470" fill="url(#bglow)"/>
<g id="btk">
