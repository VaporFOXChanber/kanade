<circle cx="512" cy="540" r="296" fill="url(#brim)" filter="url(#bds)"/>
<circle cx="512" cy="540" r="268" fill="url(#bcap)"/>
<g fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2">
<circle cx="512" cy="540" r="48"/>
<circle cx="512" cy="540" r="70"/>
<circle cx="512" cy="540" r="92"/>
